<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-cyan-600 flex items-center justify-center">
            <span class="text-white font-bold text-sm">VV</span>
          </div>
          <span class="font-semibold text-slate-900">VacancyVault <span class="font-normal text-slate-500">crawler</span></span>
        </div>

        <div *ngIf="sessionService.admin() as admin" class="flex items-center gap-4">
          <span class="text-sm text-slate-600">{{ admin.username }}</span>
          <button (click)="logout()" class="px-3 py-1.5 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">
            Log out
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>
