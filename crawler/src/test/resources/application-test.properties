# Testcontainers supplies the datasource, see PostgresContainerTest.

# Flyway builds the schema and Hibernate only validates against it, exactly as in production
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# The tests' own SQL names tables without the schema, so their connections default to it.
# The application does not rely on this: Hibernate qualifies every table itself.
spring.datasource.hikari.schema=crawler

# @DataJpaTest would otherwise swap in an embedded database and skip the migrations
spring.test.database.replace=none

logging.level.org.flywaydb=INFO

# Mongo only holds the history of finished runs, which no test here reads. The driver connects
# lazily, so pointing it at an unreachable host costs nothing until something uses it.
spring.data.mongodb.uri=mongodb://localhost:27017/crawler-progress-test

# No broker runs during tests; the Kafka beans stay, pointed at nothing.
spring.kafka.bootstrap-servers=localhost:9092

# With nothing listening, every metadata fetch waits out the default timeouts, which is minutes
# of wall clock across a suite's context starts. These bound that wait.
spring.kafka.properties.default.api.timeout.ms=2000
spring.kafka.properties.request.timeout.ms=1000
spring.kafka.properties.metadata.max.age.ms=1000
spring.kafka.properties.reconnect.backoff.max.ms=1000
spring.kafka.properties.socket.connection.setup.timeout.ms=1000

# Required by @Value injections that have no default
KAFKA_VACANCIES_TOPIC=vacancies
CRAWLER_BROWSER_POOL_SIZE=1
