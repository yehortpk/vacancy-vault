# Logs properties
# Raise to INFO temporarily to see consumer rebalances / group evictions
logging.level.org.apache.kafka=ERROR
logging.level.com.github.yehortpk=INFO

# PostgreSQL properties. The database is shared, the schema is this service's own
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=jdbc:postgresql://notifier-postgres:5432/notifier

# Spring Data JPA + Hibernate configs
spring.jpa.show-sql=true
# Flyway owns the schema; Hibernate only checks the entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=dashboard

# Flyway creates the schema and keeps its history table inside it
spring.flyway.enabled=true
spring.flyway.schemas=dashboard

# Actuator: the compose healthcheck reads it
management.endpoint.health.show-details=always

# Services urls
frontend-service-url=http://notifier-frontend:4200
