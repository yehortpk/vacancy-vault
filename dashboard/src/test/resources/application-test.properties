# Testcontainers supplies the datasource, see PostgresContainerTest.

# Flyway builds the schema and Hibernate only validates against it, exactly as in production
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# The tests' own SQL names tables without the schema, so their connections default to it.
# The application does not rely on this: Hibernate qualifies every table itself.
spring.datasource.hikari.schema=dashboard

# @DataJpaTest would otherwise swap in an embedded database and skip the migrations
spring.test.database.replace=none

spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO

# Required by @Value injections that have no default
frontend-service-url=http://notifier-frontend:4200
