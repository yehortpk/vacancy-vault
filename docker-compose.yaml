services:
  parser:
    container_name: notifier-parser
    build:
      dockerfile: ./parser/Dockerfile
    # Defaults to the image's "ubuntu" user (1000:1000); set HOST_UID/HOST_GID in .env if your Linux uid differs
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/opt/app
      - maven-home:/home/ubuntu
    networks:
      - notifier-network
    ports:
      - "5005:5005"
      - "8082:8080"
    environment:
      KAFKA_PARSER_TOPIC: vacancies
      # How many Chromium instances may run at once: a number, or "max" for as many as the
      # host's CPUs and memory allow. See README
      PARSER_BROWSER_POOL_SIZE: ${PARSER_BROWSER_POOL_SIZE:-2}
    depends_on:
      router:
        condition: service_healthy

  router:
    container_name: notifier-router
    build:
      dockerfile: ./router/Dockerfile
    # Defaults to the image's "ubuntu" user (1000:1000); set HOST_UID/HOST_GID in .env if your Linux uid differs
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/opt/app
      - maven-home:/home/ubuntu
    networks:
      - notifier-network
    ports:
      - "8081:8080"
      - "5006:5006"
    environment:
      KAFKA_PARSER_TOPIC: vacancies
      KAFKA_SUBSCRIBE_TOPIC: subscriptions
      KAFKA_BOT_NOTIFIER_TOPIC: bot-notifier
      # Optional database credentials, see README. Keep the defaults in sync with the postgres and
      # mongo services below
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-notifier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifier}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-progress}
      MONGO_ROOT_PASS: ${MONGO_ROOT_PASS:-progress}
      # Defaults documented in the README; generate your own on a server reachable from the internet
      JWT_SECRET: ${JWT_SECRET:-bDGvjQnfBnIiGi8eLnKJds3Oka82zHhLO83YIcIp8Bs=}
      # Defaults documented in the README; set both empty in .env to create no admin
      ADMIN_EMAIL: ${ADMIN_EMAIL-admin@vacancy.vault}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD-f7b3175b5f}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  bot:
    container_name: notifier-bot
    build:
      dockerfile: ./subscriber-bot/Dockerfile
    # Defaults to the image's "ubuntu" user (1000:1000); set HOST_UID/HOST_GID in .env if your Linux uid differs
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/opt/app
      - maven-home:/home/ubuntu
    networks:
      - notifier-network
    ports:
      - "5007:5007"
    environment:
      KAFKA_SUBSCRIBE_TOPIC: subscriptions
      KAFKA_BOT_NOTIFIER_TOPIC: bot-notifier
      TG_BOT_API_KEY: ${TG_BOT_API_KEY}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME}
    depends_on:
      router:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: notifier-frontend
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "4200:4200"
    networks:
      - notifier-network
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --poll 2000"

  redis:
    image: redis:7.2.4
    container_name: notifier-redis
    volumes:
      - notifier-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - notifier-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: apache/kafka:4.3.2
    container_name: notifier-kafka
    ports:
      - "29092:29092"
      - "9092"
    networks:
      - notifier-network
    volumes:
      - notifier-kafka-data:/var/lib/kafka/data
    environment:
      # KRaft: a single node that is both the broker and its own controller. The image formats its
      # storage with a built-in CLUSTER_ID, enough for a node that forms a cluster with no other
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@notifier-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://notifier-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      # The image sets these loggers to INFO explicitly, so the root level misses them
      KAFKA_LOG4J_LOGGERS: kafka=WARN,org.apache.kafka=WARN,org.apache.kafka.controller=WARN,state.change.logger=WARN
    healthcheck:
      # Query the broker itself, so the check fails until it has joined its controller
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:16.2
    container_name: notifier-postgres
    volumes:
      - notifier-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - notifier-network
    environment:
      POSTGRES_DB: notifier
      # Applied only when the data volume is first created. The router connects as this user, the
      # database superuser; Flyway builds the schema on the router's first start
      POSTGRES_USER: ${POSTGRES_USERNAME:-notifier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifier}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-notifier} -d notifier" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8.0
    container_name: notifier-mongo
    ports:
      - "27017:27017"
    environment:
      # Applied only when the data volume is first created
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-progress}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-progress}
      MONGO_INITDB_DATABASE: parser-progress
    networks:
      - notifier-network
    volumes:
      - notifier-mongo-data:/data/db
      - ./init-parsing-history.js:/docker-entrypoint-initdb.d/init-parsing-history.js:ro

networks:
  notifier-network:
    driver: bridge

volumes:
  notifier-kafka-data:
  notifier-postgres-data:
  notifier-redis-data:
  notifier-mongo-data:
  frontend-node-modules:
  maven-home:
