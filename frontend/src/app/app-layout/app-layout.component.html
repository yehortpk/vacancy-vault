<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-950 dark:to-slate-900">
  <!-- Top Navigation -->
  <nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <!-- Logo -->
        <a routerLink="dashboard" class="flex items-center gap-3 flex-shrink-0 hover:opacity-80 transition-opacity">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-cyan-600 flex items-center justify-center">
            <span class="text-white font-bold text-sm">VV</span>
          </div>
          <span class="font-semibold text-slate-900 dark:text-white hidden sm:inline">VacancyVault</span>
        </a>

        <!-- Search -->
        <form (ngSubmit)="onSubmit()" class="hidden sm:block flex-1 max-w-xs">
          <input
            [(ngModel)]="searchTerm"
            name="search"
            type="text"
            placeholder="Search jobs..."
            class="w-full px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white dark:focus:bg-slate-700 transition-all"
          />
        </form>

        <!-- Right Actions -->
        <div class="flex items-center gap-3">
          <div class="relative">
            <button
              (click)="toggleProfileMenu()"
              class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
              aria-label="Profile">
              <img src="/img/logo/dummy.jpg" alt="Profile" class="w-7 h-7 rounded-full object-cover" />
            </button>
            <div
              *ngIf="isProfileMenuOpen"
              (clickOutside)="closeProfileMenu()"
              (keydown.escape)="closeProfileMenu()"
              class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden z-50">
              <ng-container *ngIf="authService.account() as account; else guestMenu">
                <p class="px-4 py-2.5 text-xs text-slate-500 dark:text-slate-400 truncate border-b border-slate-200 dark:border-slate-700">{{ account.email }}</p>
                <a routerLink="account" (click)="closeProfileMenu()" class="block px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">My account</a>
                <a *ngIf="authService.isAdmin()" routerLink="parser" (click)="closeProfileMenu()" class="block px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Parser</a>
                <button (click)="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20 transition-colors">Log out</button>
              </ng-container>
              <ng-template #guestMenu>
                <a routerLink="login" (click)="closeProfileMenu()" class="block px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Log in</a>
                <a routerLink="register" (click)="closeProfileMenu()" class="block px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Register</a>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>
