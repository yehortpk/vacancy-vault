<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-950 dark:to-slate-900">
  <!-- Top Navigation -->
  <nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <!-- Logo -->
        <a routerLink="dashboard" class="flex items-center gap-3 flex-shrink-0 hover:opacity-80 transition-opacity">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-cyan-600 flex items-center justify-center">
            <span class="text-white font-bold text-sm">VV</span>
          </div>
          <span class="font-semibold text-slate-900 dark:text-white hidden sm:inline">VacancyVault</span>
        </a>

        <!-- Desktop Nav -->
        <div class="hidden md:flex items-center gap-1">
          <a
            routerLink="dashboard"
            routerLinkActive="bg-slate-100 dark:bg-slate-800 text-blue-600 dark:text-blue-400"
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
          >
            Dashboard
          </a>
          <a
            routerLink="parser"
            routerLinkActive="bg-slate-100 dark:bg-slate-800 text-blue-600 dark:text-blue-400"
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
          >
            Parser
          </a>
        </div>

        <!-- Search -->
        <form (ngSubmit)="onSubmit()" class="hidden sm:block flex-1 max-w-xs">
          <input
            [(ngModel)]="searchTerm"
            name="search"
            type="text"
            placeholder="Search jobs..."
            class="w-full px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white dark:focus:bg-slate-700 transition-all"
          />
        </form>

        <!-- Right Actions -->
        <div class="flex items-center gap-3">
          <button
            (click)="toggleSideMenu()"
            class="md:hidden p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
            aria-label="Menu">
            <svg class="w-5 h-5 text-slate-600 dark:text-slate-300" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
            </svg>
          </button>

          <div class="relative">
            <button
              (click)="toggleProfileMenu()"
              class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
              aria-label="Profile">
              <img src="/img/logo/dummy.jpg" alt="Profile" class="w-7 h-7 rounded-full object-cover" />
            </button>
            <div
              *ngIf="isProfileMenuOpen"
              (clickOutside)="closeProfileMenu()"
              (keydown.escape)="closeProfileMenu()"
              class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden z-50">
              <a href="#" class="block px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Profile</a>
              <a href="#" class="block px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Settings</a>
              <a href="#" class="block px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20 transition-colors">Log out</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div *ngIf="isSideMenuOpen" class="fixed inset-0 z-40 md:hidden">
    <div class="fixed inset-0 bg-black/50" (click)="closeSideMenu()"></div>
    <div class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-slate-800 shadow-lg">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700">
        <h2 class="font-semibold text-slate-900 dark:text-white">Menu</h2>
      </div>
      <nav class="p-4 space-y-2">
        <a
          routerLink="dashboard"
          (click)="closeSideMenu()"
          class="block px-4 py-2 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
          Dashboard
        </a>
        <a
          routerLink="parser"
          (click)="closeSideMenu()"
          class="block px-4 py-2 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
          Parser
        </a>
      </nav>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>
