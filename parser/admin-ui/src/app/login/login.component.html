<div class="py-16 px-4 flex justify-center">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">Parser admin</h1>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input id="username" name="username" type="text" required autocomplete="username" [(ngModel)]="username"
          class="w-full px-4 py-2 rounded-lg bg-slate-100 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" [(ngModel)]="password"
          class="w-full px-4 py-2 rounded-lg bg-slate-100 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <p *ngIf="error" role="alert" class="text-sm text-red-600">{{ error }}</p>

      <button type="submit" [disabled]="isSubmitting"
        class="w-full px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-50 transition-colors">
        Log in
      </button>
    </form>
  </div>
</div>
