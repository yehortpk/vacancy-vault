# Logs
logging.level.org.apache.kafka=ERROR
logging.level.com.github.yehortpk.parser=INFO

spring.main.banner-mode=off

# Browser pool. Caps concurrent Chromium instances, and with them the parser's memory and CPU use.
# A number, or "max" to size it from the host's CPUs and memory, see BrowserPool. The default is
# set in docker-compose.yaml
parser.browser.pool-size=${PARSER_BROWSER_POOL_SIZE}

# Kafka
spring.kafka.bootstrap-servers=vv-kafka:9092

# PostgreSQL properties. The database is shared, the schema is this service's own
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=jdbc:postgresql://vv-postgres:5432/notifier

# Spring Data JPA + Hibernate configs
# Flyway owns the schema; Hibernate only checks the entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=parser
# Nothing is rendered from an entity, so no session needs to outlive its transaction
spring.jpa.open-in-view=false

# Flyway creates the schema and keeps its history table inside it
spring.flyway.enabled=true
spring.flyway.schemas=parser

# Mongodb properties: the history of finished parsing runs
spring.data.mongodb.host=vv-mongo
spring.data.mongodb.port=27017
spring.data.mongodb.database=parser-progress
spring.data.mongodb.username=${MONGO_ROOT_USERNAME}
spring.data.mongodb.password=${MONGO_ROOT_PASS}
spring.data.mongodb.authentication-database=admin

# Optional: the first admin of the panel, created on startup if the username is not taken yet
parser.admin.username=${PARSER_ADMIN_USERNAME:}
parser.admin.password=${PARSER_ADMIN_PASSWORD:}

# Outdated vacancies: when the vacancies whose one-week grace period has expired are dropped and
# reported as removed to vacancies. Weekly, Monday 03:00 (second minute hour day month weekday)
outdated-vacancy.sweep-cron=0 0 3 * * MON

# Actuator
management.endpoint.health.show-details=never

# Admin sessions live in server memory and never expire on their own: they end only when the
# parser restarts. A zero timeout means no expiry; the cookie is kept for a year so closing
# the browser does not log the admin out either.
server.servlet.session.timeout=0
server.servlet.session.cookie.max-age=365d
