# Kafka configs
spring.kafka.bootstrap-servers=notifier-kafka:9092
vacancy-consumer-group-id=router-vacancy-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest


# Logs properties
# Raise to INFO temporarily to see consumer rebalances / group evictions
logging.level.org.apache.kafka=ERROR
logging.level.com.github.yehortpk=INFO

# PostgreSQL properties
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=jdbc:postgresql://notifier-postgres:5432/notifier

# Spring Data JPA + Hibernate configs
spring.jpa.show-sql=true
# Flyway owns the schema; Hibernate only checks the entities against it
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
# Lets an already-populated database adopt V1 without re-running it
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# To insert in a batch
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# Actuator: expose health component details so a failing listener container is diagnosable
management.endpoint.health.show-details=always

# Security
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=PT15M
jwt.refresh-token-ttl=P30D
service.connector-token=${SERVICE_CONNECTOR_TOKEN}
# How long a one-time link code stays usable after the user starts linking
link.session-ttl=PT15M
# Optional: the admin account created on startup if the address is not registered yet
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Services urls
frontend-service-url=http://notifier-frontend:4200
