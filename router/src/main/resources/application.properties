# Kafka configs
spring.kafka.bootstrap-servers=vv-kafka:9092
vacancy-consumer-group-id=router-vacancy-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest


# Logs properties
# Raise to INFO temporarily to see consumer rebalances / group evictions
logging.level.org.apache.kafka=ERROR
logging.level.com.github.yehortpk=INFO

# PostgreSQL properties. The database is shared, the schema is this service's own
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=jdbc:postgresql://vv-postgres:5432/notifier

# Spring Data JPA + Hibernate configs
spring.jpa.show-sql=true
# Flyway owns the schema; Hibernate only checks the entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=router

# Flyway creates the schema and keeps its history table inside it
spring.flyway.enabled=true
spring.flyway.schemas=router

# To insert in a batch
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# Actuator: expose health component details so a failing listener container is diagnosable
management.endpoint.health.show-details=always

# Security
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=PT15M
jwt.refresh-token-ttl=P30D
service.connector-token=${SERVICE_CONNECTOR_TOKEN}
# How long a one-time link code stays usable after the user starts linking
link.session-ttl=PT15M

# Notified vacancies
# How long the link of a notified vacancy is remembered. Must not be shorter than the retention
# of the vacancies topic (the broker's default is 7 days), or a replay could notify twice
notified-vacancy.retention=P8D
notified-vacancy.sweep-interval=PT1H

# Services urls
frontend-service-url=http://vv-frontend:4200
