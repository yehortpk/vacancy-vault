# Testcontainers supplies the datasource via @ServiceConnection, so no url/credentials here.

# Flyway builds the schema and Hibernate only validates against it, exactly as in production
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# @DataJpaTest would otherwise swap in an embedded database and skip the migrations
spring.test.database.replace=none

# Mongo only holds parser progress, which no test here touches. Its autoconfiguration stays
# on, because excluding it still leaves @EnableMongoRepositories scanning
# ParsingHistoryRepository, which then fails on the missing mongoTemplate. The driver
# connects lazily, so pointing it at an unreachable host costs nothing until something reads.
spring.data.mongodb.uri=mongodb://localhost:27017/parser-progress-test

spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO

# No broker runs during tests. @ConditionalOnProperty counts an empty value as present, so
# this cannot switch the Kafka beans off — and it must not, since excluding
# KafkaAutoConfiguration leaves KafkaListenerHealthIndicator without the listener registry
# it requires. The beans therefore stay, pointed at nothing.
spring.kafka.bootstrap-servers=localhost:9092

# With nothing listening, every metadata fetch and every listener-container start waits out
# the default timeouts, which is minutes of wall clock across a suite's context starts.
# These bound that wait to the point where an unreachable broker costs almost nothing.
spring.kafka.properties.default.api.timeout.ms=2000
spring.kafka.properties.request.timeout.ms=1000
spring.kafka.properties.metadata.max.age.ms=1000
spring.kafka.properties.reconnect.backoff.max.ms=1000
spring.kafka.properties.socket.connection.setup.timeout.ms=1000
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=2000
spring.kafka.producer.retries=0
spring.kafka.listener.missing-topics-fatal=false

# Required by @Value injections that have no default
KAFKA_PARSER_TOPIC=vacancies
KAFKA_BOT_NOTIFIER_TOPIC=bot-notifier
jwt.secret=a-test-signing-secret-long-enough-for-hs256
jwt.access-token-ttl=PT15M
jwt.refresh-token-ttl=P30D
service.connector-token=test-service-token
notifier.enabled=false
parser-service-url=http://notifier-parser:8080
frontend-service-url=http://notifier-frontend:4200
