# Testcontainers supplies the datasource via @ServiceConnection, so no url/credentials here.

# Flyway builds the schema and Hibernate only validates against it, exactly as in production
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# @DataJpaTest would otherwise swap in an embedded database and skip the migrations
spring.test.database.replace=none

# Kafka and Mongo are not part of these slices
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO
