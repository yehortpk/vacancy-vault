<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" width="1240" height="910" role="img" aria-label="Parser structure. Implementations are green, interfaces grey, value types blue in their own panel. ParserRunnerService resolves a CompanyCrawler once. DefaultCompanyCrawler implements it, configures FetchSettings and the PageScraper for each page, uses a CompanyMetadataCrawler, NoCallMetadataCrawler by default, which returns MetadataParams, and implements parseVacancies as parsePreviewVacancies followed by a call per vacancy through a VacancyCrawler, NoCallVacancyCrawler by default, which returns the VacancyDTO that replaces the preview one. Company crawlers extend DefaultCompanyCrawler. PageScraper takes FetchSettings and returns PageScraperResponse; StaticPageScraper is the default, DynamicPageScraper renders pages in a browser borrowed from the BrowserPool.">
  <style>
    svg {
      --panel: #fdfdfe; --box: #eef1f6; --fg: #1b2230; --muted: #5d6778; --line: #3a4456;
      --impl-fill: #e3f2e6; --impl-stroke: #2e7d46; --type-fill: #e3edfb; --type-stroke: #2f5fb3;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #171b23; --box: #1f2530; --fg: #e4e8ef; --muted: #97a1b2; --line: #aab3c2;
        --impl-fill: #14291c; --impl-stroke: #5fc27f; --type-fill: #15233b; --type-stroke: #6ea2f0;
      }
    }
    .bg { fill: var(--panel); }
    .d-iface { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .d-impl { fill: var(--impl-fill); stroke: var(--impl-stroke); stroke-width: 1.5; }
    .d-type { fill: var(--type-fill); stroke: var(--type-stroke); stroke-width: 1.5; }
    .d-panel { fill: none; stroke: var(--muted); stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 2 4; }
    .d-div { stroke: var(--muted); stroke-opacity: 0.4; stroke-width: 1; }
    .d-name { font: 600 12.5px var(--sans); fill: var(--fg); text-anchor: middle; }
    .d-st { font: 400 10px var(--sans); fill: var(--muted); text-anchor: middle; }
    .d-mem { font: 500 9.5px var(--mono); fill: var(--fg); white-space: pre; }
    .d-note { font: 400 10.5px var(--sans); fill: var(--muted); }
    .d-sec { font: 500 9px var(--sans); fill: var(--muted); letter-spacing: 0.08em; }
    .d-lbl { font: 400 10.5px var(--sans); fill: var(--fg); }
    .d-mid { text-anchor: middle; }
    .d-edge { stroke: var(--line); stroke-width: 1.2; fill: none; }
    .d-dash { stroke-dasharray: 5 4; }
    .m-tri { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .m-arr { fill: none; stroke: var(--line); stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="tri2" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L13 7 L1.5 12.5 Z" class="m-tri"/></marker>
    <marker id="arr2" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 1.5 L11 6 L2 10.5" class="m-arr"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="910" class="bg"/>

  <!-- ===== types panel ===== -->
  <rect x="680" y="100" width="280" height="700" rx="6" class="d-panel"/>
  <text x="692" y="118" class="d-sec">TYPES</text>

  <!-- ===== edges ===== -->
  <line x1="162" y1="70" x2="162" y2="110" class="d-edge" marker-end="url(#arr2)"/>
  <text x="170" y="94" class="d-lbl">get(beanClass), once</text>
  <line x1="162" y1="260" x2="162" y2="200" class="d-edge d-dash" marker-end="url(#tri2)"/>
  <text x="170" y="235" class="d-lbl">implements</text>
  <line x1="162" y1="560" x2="162" y2="524" class="d-edge" marker-end="url(#tri2)"/>
  <text x="170" y="547" class="d-lbl">extends</text>
  <polyline points="305,280 340,280 340,85 1115,85 1115,128" class="d-edge" marker-end="url(#arr2)"/>
  <text x="720" y="79" class="d-lbl d-mid">configurePageScraper(pageId), then scrapePage(settings)</text>
  <line x1="305" y1="300" x2="690" y2="300" class="d-edge d-dash" marker-end="url(#arr2)"/>
  <text x="500" y="292" class="d-lbl d-mid">configureFetchSettings(company, pageId)</text>
  <line x1="305" y1="360" x2="375" y2="360" class="d-edge" marker-end="url(#arr2)"/>
  <text x="340" y="352" class="d-lbl d-mid">uses</text>
  <line x1="500" y1="465" x2="500" y2="435" class="d-edge d-dash" marker-end="url(#tri2)"/>
  <text x="508" y="453" class="d-lbl">implements</text>
  <line x1="625" y1="420" x2="690" y2="440" class="d-edge" marker-end="url(#arr2)"/>
  <text x="657" y="420" class="d-lbl d-mid">returns</text>
  <polyline points="305,500 340,500 340,640 375,640" class="d-edge" marker-end="url(#arr2)"/>
  <text x="346" y="575" class="d-lbl">uses</text>
  <line x1="500" y1="750" x2="500" y2="716" class="d-edge d-dash" marker-end="url(#tri2)"/>
  <text x="508" y="737" class="d-lbl">implements</text>
  <line x1="625" y1="705" x2="690" y2="725" class="d-edge" marker-end="url(#arr2)"/>
  <text x="657" y="705" class="d-lbl d-mid">returns</text>
  <line x1="1020" y1="150" x2="950" y2="150" class="d-edge" marker-end="url(#arr2)"/>
  <text x="985" y="142" class="d-lbl d-mid">takes</text>
  <polyline points="1020,188 985,188 985,590 950,590" class="d-edge" marker-end="url(#arr2)"/>
  <text x="991" y="525" class="d-lbl">returns</text>
  <polyline points="1226,315 1226,180 1210,180" class="d-edge d-dash" marker-end="url(#tri2)"/>
  <line x1="1210" y1="255" x2="1226" y2="255" class="d-edge d-dash"/>
  <line x1="1210" y1="315" x2="1226" y2="315" class="d-edge d-dash"/>

  <!-- ===== runner ===== -->
  <rect x="20" y="20" width="285" height="50" rx="3" class="d-impl"/>
  <text x="162" y="50" class="d-name">ParserRunnerService</text>

  <!-- ===== CompanyCrawler ===== -->
  <rect x="20" y="110" width="285" height="90" rx="3" class="d-iface"/>
  <text x="162" y="128" class="d-st">«interface»</text>
  <text x="162" y="144" class="d-name">CompanyCrawler</text>
  <line x1="20" y1="154" x2="305" y2="154" class="d-div"/>
  <text x="32" y="171" class="d-mem">parseVacancies(page, company)</text>
  <text x="32" y="186" class="d-mem">scrapeCompanyVacancies(company)</text>

  <!-- ===== DefaultCompanyCrawler ===== -->
  <rect x="20" y="260" width="285" height="264" rx="3" class="d-impl"/>
  <text x="162" y="278" class="d-st">«abstract class» · no per-run state</text>
  <text x="162" y="294" class="d-name">DefaultCompanyCrawler</text>
  <line x1="20" y1="304" x2="305" y2="304" class="d-div"/>
  <text x="32" y="321" class="d-mem">scrapeCompanyVacancies(company)</text>
  <text x="32" y="336" class="d-mem">parseVacancies(page, company)  final</text>
  <text x="32" y="356" class="d-sec">ABSTRACT</text>
  <text x="32" y="372" class="d-mem">configureFetchSettings(company, pageId)</text>
  <text x="32" y="387" class="d-mem">parsePreviewVacancies(page, company)</text>
  <text x="32" y="407" class="d-sec">HOOKS, WITH DEFAULTS</text>
  <text x="32" y="423" class="d-mem">configurePageScraper(pageId)  Static</text>
  <text x="32" y="438" class="d-mem">configureMetadataCrawler()  NoCall</text>
  <text x="32" y="453" class="d-mem">configureVacancyCrawler()  NoCall</text>
  <line x1="20" y1="463" x2="305" y2="463" class="d-div"/>
  <text x="32" y="480" class="d-mem">@Autowired parsingProgressService</text>
  <text x="32" y="497" class="d-note">metadata call · vacancy calls · placeholders</text>
  <text x="32" y="512" class="d-note">stop-aware delays · wraps failures in *Exception</text>

  <!-- ===== company crawlers ===== -->
  <rect x="20" y="560" width="285" height="126" rx="3" class="d-impl"/>
  <text x="162" y="581" class="d-name">company crawlers</text>
  <text x="162" y="597" class="d-st">@Component · extends DefaultCompanyCrawler</text>
  <line x1="20" y1="607" x2="305" y2="607" class="d-div"/>
  <text x="32" y="625" class="d-note">implement parsePreviewVacancies,</text>
  <text x="32" y="641" class="d-note">configureFetchSettings</text>
  <text x="32" y="657" class="d-note">may override the three configure hooks</text>
  <text x="32" y="673" class="d-note">create scrapers with new</text>

  <!-- ===== CompanyMetadataCrawler ===== -->
  <rect x="375" y="330" width="250" height="105" rx="3" class="d-iface"/>
  <text x="500" y="348" class="d-st">«interface»</text>
  <text x="500" y="364" class="d-name">CompanyMetadataCrawler</text>
  <line x1="375" y1="374" x2="625" y2="374" class="d-div"/>
  <text x="387" y="391" class="d-mem">configureFetchSettings(company)</text>
  <text x="387" y="406" class="d-mem">configurePageScraper()</text>
  <text x="387" y="421" class="d-mem">parseMetadata(response)</text>

  <!-- ===== NoCallMetadataCrawler ===== -->
  <rect x="375" y="465" width="250" height="75" rx="3" class="d-impl"/>
  <text x="500" y="486" class="d-name">NoCallMetadataCrawler</text>
  <text x="500" y="502" class="d-st">default for configureMetadataCrawler()</text>
  <line x1="375" y1="512" x2="625" y2="512" class="d-div"/>
  <text x="387" y="529" class="d-note">no I/O · one page · empty maps</text>

  <!-- ===== VacancyCrawler ===== -->
  <rect x="375" y="600" width="250" height="116" rx="3" class="d-iface"/>
  <text x="500" y="618" class="d-st">«interface» · one call per vacancy</text>
  <text x="500" y="634" class="d-name">VacancyCrawler</text>
  <line x1="375" y1="644" x2="625" y2="644" class="d-div"/>
  <text x="387" y="661" class="d-mem">configureFetchSettings(preview,</text>
  <text x="387" y="676" class="d-mem">    company, vacancyOrderOnPage)</text>
  <text x="387" y="691" class="d-mem">configurePageScraper()</text>
  <text x="387" y="706" class="d-mem">parseVacancy(preview, response)</text>

  <!-- ===== NoCallVacancyCrawler ===== -->
  <rect x="375" y="750" width="250" height="75" rx="3" class="d-impl"/>
  <text x="500" y="771" class="d-name">NoCallVacancyCrawler</text>
  <text x="500" y="787" class="d-st">default for configureVacancyCrawler()</text>
  <line x1="375" y1="797" x2="625" y2="797" class="d-div"/>
  <text x="387" y="814" class="d-note">no I/O · returns a copy of the preview</text>
  <text x="387" y="850" class="d-note">a crawler that needs a call returns a</text>
  <text x="387" y="865" class="d-note">nested class that implements</text>
  <text x="387" y="880" class="d-note">CompanyMetadataCrawler or VacancyCrawler</text>

  <!-- ===== FetchSettings ===== -->
  <rect x="690" y="128" width="260" height="220" rx="3" class="d-type"/>
  <text x="820" y="146" class="d-st">«type» · immutable · one per page or call</text>
  <text x="820" y="162" class="d-name">FetchSettings</text>
  <line x1="690" y1="172" x2="950" y2="172" class="d-div"/>
  <text x="702" y="189" class="d-mem">pageId</text>
  <text x="702" y="204" class="d-mem">pageURL           set by the crawler</text>
  <text x="702" y="219" class="d-mem">data              page: company's if unset</text>
  <text x="702" y="234" class="d-mem">headers           page: company's if unset</text>
  <text x="702" y="249" class="d-mem">cookies           page: company's if unset</text>
  <text x="702" y="264" class="d-mem">connectionMethod  GET unless set</text>
  <text x="702" y="279" class="d-mem">timeoutSec        60 unless set</text>
  <text x="702" y="294" class="d-mem">followRedirects   true unless set</text>
  <text x="702" y="309" class="d-mem">delay             0 s unless set</text>
  <line x1="690" y1="318" x2="950" y2="318" class="d-div"/>
  <text x="702" y="335" class="d-mem">fillPlaceholders(placeholders)</text>

  <!-- ===== MetadataParams ===== -->
  <rect x="690" y="383" width="260" height="120" rx="3" class="d-type"/>
  <text x="820" y="401" class="d-st">«type» · empty maps by default</text>
  <text x="820" y="417" class="d-name">MetadataParams</text>
  <line x1="690" y1="427" x2="950" y2="427" class="d-div"/>
  <text x="702" y="444" class="d-mem">pagesCount</text>
  <text x="702" y="459" class="d-mem">placeholders</text>
  <text x="702" y="474" class="d-mem">requestHeaders    override by key</text>
  <text x="702" y="489" class="d-mem">requestCookies    override by key</text>

  <!-- ===== PageScraperResponse ===== -->
  <rect x="690" y="523" width="260" height="134" rx="3" class="d-type"/>
  <text x="820" y="541" class="d-st">«type» · one per page or call</text>
  <text x="820" y="557" class="d-name">PageScraperResponse</text>
  <line x1="690" y1="567" x2="950" y2="567" class="d-div"/>
  <text x="702" y="584" class="d-mem">pageId</text>
  <text x="702" y="599" class="d-mem">pageURL</text>
  <text x="702" y="614" class="d-mem">headers           response</text>
  <text x="702" y="629" class="d-mem">cookies           response</text>
  <text x="702" y="644" class="d-mem">body</text>

  <!-- ===== VacancyDTO ===== -->
  <rect x="690" y="677" width="260" height="105" rx="3" class="d-type"/>
  <text x="820" y="695" class="d-st">«type» · replaces the preview one</text>
  <text x="820" y="711" class="d-name">VacancyDTO</text>
  <line x1="690" y1="721" x2="950" y2="721" class="d-div"/>
  <text x="702" y="738" class="d-mem">link              identity, keep it</text>
  <text x="702" y="753" class="d-mem">description, ...</text>
  <text x="702" y="768" class="d-mem">toBuilder()</text>

  <!-- ===== PageScraper ===== -->
  <rect x="1020" y="128" width="190" height="70" rx="3" class="d-iface"/>
  <text x="1115" y="146" class="d-st">«interface» · I/O only</text>
  <text x="1115" y="162" class="d-name">PageScraper</text>
  <line x1="1020" y1="172" x2="1210" y2="172" class="d-div"/>
  <text x="1032" y="188" class="d-mem">scrapePage(settings)</text>

  <rect x="1020" y="233" width="190" height="44" rx="3" class="d-impl"/>
  <text x="1115" y="252" class="d-name">StaticPageScraper</text>
  <text x="1115" y="268" class="d-note d-mid">HttpClient · default · new per page</text>

  <rect x="1020" y="293" width="190" height="44" rx="3" class="d-impl"/>
  <text x="1115" y="312" class="d-name">DynamicPageScraper</text>
  <text x="1115" y="328" class="d-note d-mid">new(browserPool, readySelector)</text>

  <text x="1115" y="353" class="d-note d-mid">Playwright · borrows a browser</text>
  <text x="1115" y="368" class="d-note d-mid">from the BrowserPool bean</text>

</svg>
