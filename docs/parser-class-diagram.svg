<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240" role="img" aria-label="UML class diagram of the parser crawler design. ParserRunnerService holds a map of CompanyCrawler beans and a ParsingProgressService. DefaultCompanyCrawler realizes CompanyCrawler, uses CompanyMetadataCrawler, and by default creates NoMetadataCrawler and StaticPageScraper; it throws MetadataFetchException and MetadataParseException. StaticPageScraper and DynamicPageScraper realize PageScraper; DynamicPageScraper holds a BrowserPool. The models package holds FetchSettings, MetadataParams and PageScraperResponse. A page that fails to be fetched fails with VacanciesFetchException, and parseVacancies throws VacanciesParseException. MetadataFetchException, MetadataParseException, VacanciesFetchException, VacanciesParseException and UnresolvedPlaceholderException extend RuntimeException.">
  <style>
    svg {
