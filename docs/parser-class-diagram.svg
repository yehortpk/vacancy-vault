    .u-div   { stroke: var(--line); stroke-width: 1; }
    .u-name  { font: 600 12.5px var(--sans); fill: var(--fg); text-anchor: middle; }
    .u-stereo{ font: 400 10px var(--sans); fill: var(--muted); text-anchor: middle; }
    .u-mem   { font: 400 10px var(--mono); fill: var(--fg); }
    .u-italic{ font-style: italic; }
    .u-static{ text-decoration: underline; }
    .u-edge  { stroke: var(--line); stroke-width: 1.1; fill: none; }
    .u-dash  { stroke-dasharray: 5 4; }
    .u-lbl   { font: 400 10px var(--sans); fill: var(--fg); }
    .u-note  { fill: var(--note); stroke: var(--note-line); stroke-width: 1; }
