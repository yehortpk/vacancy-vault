<path d="M460 100 H750 L760 110 V142 H460 Z" class="u-note"/>
<path d="M750 100 V110 H760" class="u-note-fold"/>
<text x="470" y="118" class="u-note-text" xml:space="preserve">crawlers: every CompanyCrawler bean,</text>
<text x="470" y="132" class="u-note-text" xml:space="preserve">keyed by bean name (company.beanClass).</text>
<line x1="201" y1="75" x2="460" y2="130" class="u-anchor"/>
<path d="M40 630 H370 L380 640 V840 H40 Z" class="u-note"/>
<path d="M370 630 V640 H380" class="u-note-fold"/>
<text x="50" y="648" class="u-note-text" xml:space="preserve">Company crawlers (@Component, one per bean_class)</text>
<text x="50" y="662" class="u-note-text" xml:space="preserve">extend DefaultCompanyCrawler.</text>
<text x="50" y="690" class="u-note-text" xml:space="preserve">scrapeCompanyVacancies(company):</text>
<text x="50" y="704" class="u-note-text" xml:space="preserve">1. extractMetadata (fails: MetadataFetchException),</text>
<text x="50" y="718" class="u-note-text" xml:space="preserve">   then parseMetadata (fails: MetadataParseException)</text>
<text x="50" y="732" class="u-note-text" xml:space="preserve">2. initPages(metadata.pagesCount)</text>
<text x="50" y="746" class="u-note-text" xml:space="preserve">3. for every page, before any request:</text>
<text x="50" y="760" class="u-note-text" xml:space="preserve">   configureFetchSettings, set pageId, fill unset</text>
<text x="50" y="774" class="u-note-text" xml:space="preserve">   fields from company, merge metadata headers</text>
<text x="50" y="788" class="u-note-text" xml:space="preserve">   and cookies by key, fillPlaceholders(+ {page})</text>
<text x="50" y="802" class="u-note-text" xml:space="preserve">4. wait delay on the stop signal, then</text>
<text x="50" y="816" class="u-note-text" xml:space="preserve">   configurePageScraper(pageId).scrapePage</text>
<text x="50" y="830" class="u-note-text" xml:space="preserve">   (fails: VacanciesFetchException)</text>
<line x1="200" y1="590" x2="200" y2="630" class="u-anchor"/>
<path d="M460 760 H750 L760 770 V816 H460 Z" class="u-note"/>
<path d="M750 760 V770 H760" class="u-note-fold"/>
<text x="470" y="778" class="u-note-text" xml:space="preserve">Page scrapers are created with new</text>
<text x="470" y="792" class="u-note-text" xml:space="preserve">inside the crawlers and are not</text>
<text x="470" y="806" class="u-note-text" xml:space="preserve">Spring beans. BrowserPool is a bean.</text>
<line x1="760" y1="790" x2="900" y2="690" class="u-anchor"/>
<path d="M460 1160 H730 L740 1170 V1216 H460 Z" class="u-note"/>
<path d="M730 1160 V1170 H740" class="u-note-fold"/>
<text x="470" y="1178" class="u-note-text" xml:space="preserve">[0..1]: left null by the crawler,</text>
<text x="470" y="1192" class="u-note-text" xml:space="preserve">then filled from the company.</text>
<text x="470" y="1206" class="u-note-text" xml:space="preserve">delay: wait before this page starts.</text>
<line x1="414" y1="1130" x2="460" y2="1180" class="u-anchor"/>
</svg>
