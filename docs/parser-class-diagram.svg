    .u-frame-tab { fill: var(--panel); stroke: var(--muted); stroke-width: 1; }
    .u-frame-name { font: 600 10.5px var(--sans); fill: var(--fg); }
    .m-tri { fill: var(--panel); stroke: var(--line); stroke-width: 1.1; }
    .m-arr { fill: none; stroke: var(--line); stroke-width: 1.1; }
